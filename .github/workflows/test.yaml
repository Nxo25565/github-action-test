name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Repo setup
        uses: actions/checkout@v6
      - run: ls
      
      - name: build
      - run: npm install
      - run: npm run build
